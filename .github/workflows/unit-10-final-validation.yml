# Fork-only execution carrier for Fieldwork upstream unit 10.
# Keep this file out of any public Cloudflare contribution.
name: Unit 10 final receiver types validation

on:
  push:
    branches:
      - unit-10/final-validation-18a117c
  pull_request:
    branches:
      - unit-10/receiver-aware-types
    paths:
      - .github/workflows/unit-10-final-validation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: 18a117c28773cd7aa0ee599e03439c5fbbf06584
  BASE_SHA: 813c31394b9909d8f557bba14324db275bc12720

jobs:
  focused-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out validation carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact product head
        run: |
          git diff --exit-code "${CANDIDATE_SHA}" HEAD -- . ':(exclude).github/workflows/unit-10-final-validation.yml'
          test "$(git diff --name-only "${CANDIDATE_SHA}" HEAD)" = ".github/workflows/unit-10-final-validation.yml"

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''

      - name: Run focused receiver targets
        run: |
          bazelisk test \
            //types:test/index.spec \
            //types:test/transforms/overrides/index.spec \
            //types:test/transforms/overrides/replacement-receiver-generics.spec \
            //types:test/transforms/globals.spec \
            //types:test/types/fetch-receiver \
            --test_output=errors

      - name: Run complete types package
        run: bazelisk test //types/... --test_output=errors

      - name: Run types lint target
        run: bazelisk test //types:types_lib@eslint --test_output=errors

  inherited-global-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out validation carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact product head
        run: |
          git diff --exit-code "${CANDIDATE_SHA}" HEAD -- . ':(exclude).github/workflows/unit-10-final-validation.yml'
          test "$(git diff --name-only "${CANDIDATE_SHA}" HEAD)" = ".github/workflows/unit-10-final-validation.yml"

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''

      - name: Build workerd
        run: bazelisk build //src/workerd/server:workerd

      - name: Run inherited Worker-global receiver probe
        run: |
          mkdir -p /tmp/unit-10-receiver-probe/test-tmp
          cat > /tmp/unit-10-receiver-probe/inherited-global-receiver.wd-test <<'CAPNP'
          using Workerd = import "/workerd/workerd.capnp";

          const unitTests :Workerd.Config = (
            services = [(
              name = "inherited-global-receiver",
              worker = (
                modules = [(
                  name = "worker",
                  esModule = embed "inherited-global-receiver.js",
                )],
              ),
            )],
          );
          CAPNP
          cat > /tmp/unit-10-receiver-probe/inherited-global-receiver.js <<'JS'
          function classify(label, callback) {
            try {
              callback();
              return "success";
            } catch (error) {
              if (error instanceof TypeError && String(error).includes("Illegal invocation")) {
                return "illegal-invocation";
              }
              throw new Error(`${label} produced an unexpected failure: ${error?.stack ?? error}`);
            }
          }

          function expectOutcome(matrix, label, expected) {
            const actual = matrix[label];
            if (actual !== expected) {
              throw new Error(`${label} expected ${expected}, got ${actual}`);
            }
          }

          export const inheritedGlobalReceivers = {
            test() {
              const matrix = {};
              const target = new EventTarget();
              const fromSelf = self.addEventListener;
              const fromTarget = target.addEventListener;

              function probe(label, invoke) {
                const type = `unit-10-${label}`;
                const handler = () => {};
                matrix[label] = classify(label, () => invoke(type, handler));
                self.removeEventListener(type, handler);
                target.removeEventListener(type, handler);
              }

              probe("self.bare", (type, handler) => fromSelf(type, handler));
              probe("self.undefined", (type, handler) => fromSelf.call(undefined, type, handler));
              probe("self.null", (type, handler) => fromSelf.call(null, type, handler));
              probe("self.globalThis", (type, handler) => fromSelf.call(globalThis, type, handler));
              probe("self.self", (type, handler) => fromSelf.call(self, type, handler));
              probe("self.unrelated", (type, handler) => fromSelf.call({}, type, handler));

              probe("target.bare", (type, handler) => fromTarget(type, handler));
              probe("target.undefined", (type, handler) => fromTarget.call(undefined, type, handler));
              probe("target.null", (type, handler) => fromTarget.call(null, type, handler));
              probe("target.globalThis", (type, handler) => fromTarget.call(globalThis, type, handler));
              probe("target.self", (type, handler) => fromTarget.call(self, type, handler));
              probe("target.owner", (type, handler) => fromTarget.call(target, type, handler));
              probe("target.unrelated", (type, handler) => fromTarget.call({}, type, handler));

              console.log(`UNIT10_RECEIVER_MATRIX=${JSON.stringify(matrix)}`);

              // These outcomes were reached before the original probe's first
              // false expectation and therefore remain exact regression anchors.
              expectOutcome(matrix, "self.bare", "success");
              expectOutcome(matrix, "self.undefined", "success");
              expectOutcome(matrix, "self.null", "success");
              expectOutcome(matrix, "self.globalThis", "success");
              expectOutcome(matrix, "self.self", "success");
              expectOutcome(matrix, "self.unrelated", "illegal-invocation");

              // The failed first generation established that a function value
              // taken from a separate EventTarget does not acquire global-owner
              // fallback merely because it is later called bare.
              expectOutcome(matrix, "target.bare", "illegal-invocation");
              expectOutcome(matrix, "target.owner", "success");
              expectOutcome(matrix, "target.unrelated", "illegal-invocation");
            },
          };
          JS
          bazel-bin/src/workerd/server/workerd test \
            --predictable \
            /tmp/unit-10-receiver-probe/inherited-global-receiver.wd-test \
            --compat-date=2999-12-31 \
            -dTEST_TMPDIR=/tmp/unit-10-receiver-probe/test-tmp

  generated-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out validation carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact product head
        run: |
          git diff --exit-code "${CANDIDATE_SHA}" HEAD -- . ':(exclude).github/workflows/unit-10-final-validation.yml'
          test "$(git diff --name-only "${CANDIDATE_SHA}" HEAD)" = ".github/workflows/unit-10-final-validation.yml"

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''

      - name: Build generated declarations
        run: bazelisk build //types

      - name: Prepare snapshot and compatibility report
        run: |
          mkdir -p unit-10-validation/generated-snapshot
          cp -aL bazel-bin/types/definitions/. unit-10-validation/generated-snapshot/
          diff -ruN types/generated-snapshot unit-10-validation/generated-snapshot > unit-10-validation/generated-snapshot.diff || test $? = 1
          ! grep -R '__JSG_GENERATED_RECEIVER__' unit-10-validation/generated-snapshot
          {
            echo "base_sha=${BASE_SHA}"
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "changed_files=$(grep '^diff ' unit-10-validation/generated-snapshot.diff | wc -l)"
            echo "added_lines=$(grep '^+' unit-10-validation/generated-snapshot.diff | grep -v '^+++' | wc -l)"
            echo "removed_lines=$(grep '^-' unit-10-validation/generated-snapshot.diff | grep -v '^---' | wc -l)"
            echo "receiver_lines=$(grep -R 'this:' unit-10-validation/generated-snapshot | wc -l)"
            echo "generated_marker_lines=0"
          } | tee unit-10-validation/summary.txt
          grep -R -n 'this:' unit-10-validation/generated-snapshot > unit-10-validation/receiver-lines.txt || true

      - name: Upload generated snapshot review packet
        uses: actions/upload-artifact@v4
        with:
          name: unit-10-generated-snapshot-${{ env.CANDIDATE_SHA }}
          path: unit-10-validation/
          if-no-files-found: error
