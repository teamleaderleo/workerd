name: Issue 474 generic replacement repair

on:
  push:
    branches:
      - execution/issue-474-generic-replacement-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical candidate
        uses: actions/checkout@v6
        with:
          ref: research/issue-474-receiver-aware-types
          fetch-depth: 0

      - name: Repair replacement receiver specialization
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs = require('node:fs')

          const sourcePath = 'types/src/transforms/overrides/index.ts'
          const before = fs.readFileSync(sourcePath, 'utf8')
          const oldLine = '  const typeParameters = override.typeParameters ?? generated.typeParameters;'
          const newLine = '  const typeParameters = override.typeParameters;'
          const count = before.split(oldLine).length - 1
          if (count !== 1) {
            throw new Error(`expected one replacement specialization line, found ${count}`)
          }
          fs.writeFileSync(sourcePath, before.replace(oldLine, newLine))

          const workflowPath = '.github/workflows/rook-issue-474-focused.yml'
          const workflow = fs.readFileSync(workflowPath, 'utf8')
          const target = '            //types:test/transforms/overrides/index.spec \\\n'
          const addition = target + '            //types:test/transforms/overrides/replacement-receiver-generics.spec \\\n'
          const targetCount = workflow.split(target).length - 1
          if (targetCount !== 1) {
            throw new Error(`expected one focused override target, found ${targetCount}`)
          }
          fs.writeFileSync(workflowPath, workflow.replace(target, addition))
          NODE

          cat > types/test/transforms/overrides/replacement-receiver-generics.spec.ts <<'EOF'
          import assert from 'node:assert';
          import { test } from 'node:test';
          import ts from 'typescript';
          import { printer } from '../../../src/print';
          import { SourcesMap, createMemoryProgram } from '../../../src/program';
          import { createOverrideDefineTransformer } from '../../../src/transforms';

          function transformReplacement(
            generated: string,
            replacement: string
          ): string {
            const sourcePath = '/source.ts';
            const sources = new SourcesMap();
            sources.set(sourcePath, generated);
            sources.set('/$virtual/overrides/Owner.ts', replacement);
            const program = createMemoryProgram(sources);
            const sourceFile = program.getSourceFile(sourcePath);
            assert(sourceFile !== undefined);
            const result = ts.transform(sourceFile, [
              createOverrideDefineTransformer(program, new Set(['Owner'])),
            ]);
            try {
              assert.strictEqual(result.transformed.length, 1);
              return printer.printFile(result.transformed[0]);
            } finally {
              result.dispose();
            }
          }

          test('generic generated owner to nongeneric replacement', () => {
            const output = transformReplacement(
              `declare abstract class Owner<T> {
                method(this: __JSG_GENERATED_RECEIVER__<Owner>): void;
              }`,
              `interface Owner {
                method(): void;
              }`
            );
            assert.match(
              output,
              /method\(this: __JSG_GENERATED_RECEIVER__<Owner>\): void;/
            );
            assert.doesNotMatch(output, /Owner<T>/);
          });

          test('generic generated owner to generic replacement', () => {
            const output = transformReplacement(
              `declare abstract class Owner<T> {
                method(this: __JSG_GENERATED_RECEIVER__<Owner>): void;
              }`,
              `interface Owner<U> {
                method(): void;
              }`
            );
            assert.match(output, /interface Owner<U>/);
            assert.match(
              output,
              /method\(this: __JSG_GENERATED_RECEIVER__<Owner<U>>\): void;/
            );
          });

          test('nongeneric generated owner to generic replacement', () => {
            const output = transformReplacement(
              `declare abstract class Owner {
                method(this: __JSG_GENERATED_RECEIVER__<Owner>): void;
              }`,
              `interface Owner<U> {
                method(): void;
              }`
            );
            assert.match(output, /interface Owner<U>/);
            assert.match(
              output,
              /method\(this: __JSG_GENERATED_RECEIVER__<Owner<U>>\): void;/
            );
          });
          EOF

          git diff --check

      - name: Commit canonical repair
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            types/src/transforms/overrides/index.ts \
            types/test/transforms/overrides/replacement-receiver-generics.spec.ts \
            .github/workflows/rook-issue-474-focused.yml
          git diff --cached --stat
          git commit -m "Repair generic replacement receiver specialization"
          git push origin HEAD:research/issue-474-receiver-aware-types
