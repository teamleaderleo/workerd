name: Rook apply issue 474 compile fixes

on:
  push:
    branches:
      - research/issue-474-receiver-aware-types
    paths:
      - .github/workflows/rook-apply-fix1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: research/issue-474-receiver-aware-types
          fetch-depth: 0

      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          globals_path = Path('types/src/transforms/globals.ts')
          globals_source = globals_path.read_text()
          old_import = '''import {
            getGeneratedReceiverOwner,
            isThisParameter,
          } from "../receiver";'''
          new_import = 'import { getGeneratedReceiverOwner } from "../receiver";'
          if old_import in globals_source:
              globals_source = globals_source.replace(old_import, new_import, 1)
          else:
              assert new_import in globals_source
          globals_path.write_text(globals_source)

          overrides_path = Path('types/src/transforms/overrides/index.ts')
          overrides_source = overrides_path.read_text()
          overloads = '''function updateMethodParameters(
            member: ts.MethodDeclaration,
            parameters: ts.NodeArray<ts.ParameterDeclaration>
          ): ts.MethodDeclaration;
          function updateMethodParameters(
            member: ts.MethodSignature,
            parameters: ts.NodeArray<ts.ParameterDeclaration>
          ): ts.MethodSignature;
          '''
          if overloads in overrides_source:
              overrides_source = overrides_source.replace(overloads, '', 1)

          class_anchor = '''  if (ts.isClassDeclaration(override)) {
            const members = override.members.map((member) => {
              const generatedIndex = findMemberIndex('''
          class_replacement = '''  if (ts.isClassDeclaration(override)) {
            const members = override.members.map((member) => {
              if (!ts.isMethodDeclaration(member)) return member;
              const generatedIndex = findMemberIndex('''
          if class_anchor in overrides_source:
              overrides_source = overrides_source.replace(
                  class_anchor, class_replacement, 1
              )
          else:
              assert class_replacement in overrides_source

          interface_anchor = '''  const members = override.members.map((member) => {
            const generatedIndex = findMemberIndex('''
          interface_replacement = '''  const members = override.members.map((member) => {
            if (!ts.isMethodSignature(member)) return member;
            const generatedIndex = findMemberIndex('''
          if interface_anchor in overrides_source:
              overrides_source = overrides_source.replace(
                  interface_anchor, interface_replacement, 1
              )
          else:
              assert interface_replacement in overrides_source

          overrides_path.write_text(overrides_source)
          PY

          git rm -f research/issue-474-fix1.patch
          git rm -f .github/workflows/rook-apply-fix1.yml
          git diff --check

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(types): compile receiver override helpers'
          git push origin HEAD:research/issue-474-receiver-aware-types
