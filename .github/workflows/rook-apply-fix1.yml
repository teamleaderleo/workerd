name: Rook apply issue 474 compile fixes

on:
  push:
    branches:
      - research/issue-474-receiver-aware-types
    paths:
      - .github/workflows/rook-apply-fix1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: research/issue-474-receiver-aware-types
          fetch-depth: 0

      - name: Apply fixes
        run: |
          git apply --check research/issue-474-fix1.patch
          git apply research/issue-474-fix1.patch
          git rm research/issue-474-fix1.patch
          git rm .github/workflows/rook-apply-fix1.yml
          git diff --check

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(types): compile receiver override helpers'
          git push origin HEAD:research/issue-474-receiver-aware-types
