name: Issue 474 generic replacement exact-head execution

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused:
    if: github.head_ref == 'execution/issue-474-generic-replacement-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact canonical candidate
        uses: actions/checkout@v6
        with:
          ref: 1c6c6ecf445513402a9b2d13b16d61e4a949f2c7
          persist-credentials: false

      - name: Record exact source fence
        run: |
          test "$(git rev-parse HEAD)" = "1c6c6ecf445513402a9b2d13b16d61e4a949f2c7"
          test -z "$(git status --porcelain)"
          grep -F "const typeParameters = override.typeParameters;" \
            types/src/transforms/overrides/index.ts
          test -f \
            types/test/transforms/overrides/replacement-receiver-generics.spec.ts

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''

      - name: Run receiver pipeline and replacement matrix
        run: |
          bazelisk test \
            //types:test/index.spec \
            //types:test/transforms/overrides/index.spec \
            //types:test/transforms/overrides/replacement-receiver-generics.spec \
            //types:test/transforms/globals.spec \
            //types:test/types/fetch-receiver \
            --test_output=errors

      - name: Confirm clean working tree
        run: test -z "$(git status --porcelain)"
