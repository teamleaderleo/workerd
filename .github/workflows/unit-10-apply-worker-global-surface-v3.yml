# Fork-only source-repair carrier for Fieldwork upstream unit 10.
# The job copies its patch script aside, resets to the exact candidate, and
# pushes a commit containing source/test files only.
name: Unit 10 apply Worker global surface repair v3

on:
  push:
    branches:
      - unit-10/apply-worker-global-surface-repair-v3
  pull_request:
    branches:
      - unit-10/receiver-aware-types
    paths:
      - .fieldwork/unit-10-apply.py
      - .github/workflows/unit-10-apply-worker-global-surface-v3.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CANDIDATE_SHA: a1628283d6160c1b8ebbfcc34b50cd5e73945977
  TARGET_BRANCH: unit-10/worker-global-surface-repair

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repair carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify carrier fence and remove machinery
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "${CANDIDATE_SHA}" HEAD)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".fieldwork/unit-10-apply.py"
          test "${changed[1]}" = ".github/workflows/unit-10-apply-worker-global-surface-v3.yml"
          cp .fieldwork/unit-10-apply.py /tmp/unit-10-apply.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/unit-10-apply.py')
          lines = path.read_text().splitlines(keepends=True)
          in_fixture_block = False
          changed = 0
          output = []
          for line in lines:
              if line.startswith('old_clean_tail = ('):
                  in_fixture_block = True
              if in_fixture_block and '"      ' in line:
                  line = line.replace('"      ', '"    ', 1)
                  changed += 1
              output.append(line)
              if line.startswith('spec = replace_once('):
                  in_fixture_block = False
          assert changed == 12, changed
          path.write_text(''.join(output))
          PY
          python3 -m py_compile /tmp/unit-10-apply.py
          git reset --hard "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain)"
          mkdir -p receipt

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''

      - name: Prepare exact standalone Prettier and bind setup residue
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = '.bazelrc'
          test "$(git ls-files --others --exclude-standard)" = 'llvm.sh'
          rm llvm.sh
          test -z "$(git ls-files --others --exclude-standard)"
          corepack enable
          pnpm --version
          test "$(pnpm dlx prettier@3.8.1 --version)" = '3.8.1'

      - name: Apply guarded source and test repair
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/unit-10-apply.py
          pnpm dlx prettier@3.8.1 --write \
            types/src/transforms/globals.ts \
            types/test/transforms/globals.spec.ts \
            types/test/types/inherited-global-receiver.ts
          git diff --check
          expected=$(printf '%s\n' \
            types/src/transforms/globals.ts \
            types/test/transforms/globals.spec.ts \
            types/test/types/inherited-global-receiver.ts | sort)
          actual=$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | grep -v '^\.bazelrc$' | grep -v '^receipt/' | sort -u)
          printf '%s\n' "$actual" > receipt/product-files.txt
          test "$actual" = "$expected"
          git diff --binary -- . ':(exclude).bazelrc' \
            > receipt/worker-global-surface-repair.patch
          git diff --no-index /dev/null types/test/types/inherited-global-receiver.ts \
            >> receipt/worker-global-surface-repair.patch || test $? = 1
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "carrier_head=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "target_branch=$TARGET_BRANCH"
            echo "prettier=3.8.1"
            echo "setup_residue=.bazelrc; llvm.sh verified and removed"
          } > receipt/identity.txt

      - name: Run focused repair tests
        shell: bash
        run: |
          set -euo pipefail
          bazelisk test \
            //types:test/transforms/globals.spec \
            //types:test/index.spec \
            //types:test/types/inherited-global-receiver \
            --test_output=errors \
            2>&1 | tee receipt/focused.log

      - name: Run types lint
        shell: bash
        run: |
          set -euo pipefail
          bazelisk test //types:types_lib@eslint --test_output=errors \
            2>&1 | tee receipt/lint.log

      - name: Commit and publish exact clean repair
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$CANDIDATE_SHA" -- .bazelrc
          git diff --check
          expected=$(printf '%s\n' \
            types/src/transforms/globals.ts \
            types/test/transforms/globals.spec.ts \
            types/test/types/inherited-global-receiver.ts | sort)
          actual=$({
            git diff --name-only
            git ls-files --others --exclude-standard
          } | grep -v '^receipt/' | sort -u)
          test "$actual" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            types/src/transforms/globals.ts \
            types/test/transforms/globals.spec.ts \
            types/test/types/inherited-global-receiver.ts
          git diff --cached --check
          git commit \
            -m "types: model inherited Worker global receivers" \
            -m "Generated with AI assistance."
          echo "source_head=$(git rev-parse HEAD)" >> receipt/identity.txt
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${CANDIDATE_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: fieldwork-unit-10-worker-global-surface
          path: receipt/
          if-no-files-found: warn
          retention-days: 30
