# Fork-only validation harness for teamleaderleo/stensibly#474.
# Keep this file out of any upstream Cloudflare contribution.
name: Issue 474 receiver-aware types

on:
  push:
    branches:
      - research/issue-474-receiver-aware-types
    paths:
      - .github/workflows/rook-issue-474-focused.yml
      - types/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rook-issue-474-focused.yml
      - types/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-22.04-16core
    timeout-minutes: 120
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "tested_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''

      - name: Run receiver pipeline tests
        run: |
          bazelisk test \
            //types:test/index.spec \
            //types:test/transforms/overrides/index.spec \
            //types:test/transforms/overrides/replacement-receiver-generics.spec \
            //types:test/transforms/globals.spec \
            //types:test/types/fetch-receiver \
            --test_output=errors

      - name: Confirm clean working tree
        run: test -z "$(git status --porcelain)"
