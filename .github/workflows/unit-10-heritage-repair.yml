# Fork-only repair carrier for Fieldwork upstream unit 10.
# This workflow removes itself before publishing the clean source commit.
name: Unit 10 transformed heritage repair

on:
  push:
    branches:
      - unit-10/receiver-aware-types-heritage-repair

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: unit-10/receiver-aware-types-heritage-repair
          fetch-depth: 0

      - name: Verify input source head
        run: test "$(git rev-parse HEAD^)" = "f167a283fc9f792c427eeded306c38602e60261d"

      - name: Apply transformed heritage repair and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          globals_path = Path('types/src/transforms/globals.ts')
          text = globals_path.read_text()

          old_collect = '''function collectNamedDeclarations(
            sourceFile: ts.SourceFile
          ): Map<string, NamedDeclaration[]> {
            const declarations = new Map<string, NamedDeclaration[]>();
            const visitor = (node: ts.Node): void => {
              if (
                (ts.isInterfaceDeclaration(node) || ts.isClassDeclaration(node)) &&
                node.name !== undefined
              ) {
                const name = node.name.text;
                const named = declarations.get(name) ?? [];
                named.push(node);
                declarations.set(name, named);
              }
              ts.forEachChild(node, visitor);
            };
            visitor(sourceFile);
            return declarations;
          }
          '''
          new_collect = '''function collectNamedDeclarations(
            sourceFile: ts.SourceFile
          ): Map<string, NamedDeclaration[]> {
            const declarations = new Map<string, NamedDeclaration[]>();
            for (const statement of sourceFile.statements) {
              if (
                (ts.isInterfaceDeclaration(statement) ||
                  ts.isClassDeclaration(statement)) &&
                statement.name !== undefined
              ) {
                const name = statement.name.text;
                const named = declarations.get(name) ?? [];
                named.push(statement);
                declarations.set(name, named);
              }
            }
            return declarations;
          }
          '''
          if old_collect not in text:
              raise SystemExit('collectNamedDeclarations input did not match')
          text = text.replace(old_collect, new_collect, 1)

          old_symbol = '''  const symbol = checker.getSymbolAtLocation(originalSuperType.expression);
            if (symbol !== undefined) {
              const symbolDeclarations = symbol.getDeclarations();
              assert.strictEqual(symbolDeclarations?.length, 1);
              const declaration = symbolDeclarations[0];
              assert(
                ts.isInterfaceDeclaration(declaration) ||
                  ts.isClassDeclaration(declaration)
              );
              return declaration;
            }
          '''
          new_symbol = '''  const symbol = checker.getSymbolAtLocation(originalSuperType.expression);
            if (symbol !== undefined) {
              const symbolDeclarations = symbol.getDeclarations();
              assert.strictEqual(symbolDeclarations?.length, 1);
              const declaration = symbolDeclarations[0];
              assert(
                ts.isInterfaceDeclaration(declaration) ||
                  ts.isClassDeclaration(declaration)
              );

              // The checker points at the pre-transform source. For top-level
              // declarations, use that symbol only to establish lexical identity,
              // then continue from the corresponding transformed declaration so
              // override-added members and generated receiver markers survive.
              if (ts.isSourceFile(declaration.parent)) {
                const candidates = declarations.get(declaration.name.text);
                assert.strictEqual(
                  candidates?.length,
                  1,
                  `Expected one transformed top-level declaration named ${declaration.name.text}, got ${candidates?.length ?? 0}`
                );
                return candidates[0];
              }

              // A nested declaration belongs to a distinct lexical scope and has
              // no transformed top-level replacement with the same identity.
              return declaration;
            }
          '''
          if old_symbol not in text:
              raise SystemExit('getHeritageDeclaration symbol block did not match')
          globals_path.write_text(text.replace(old_symbol, new_symbol, 1))

          test_path = Path('types/test/transforms/globals.spec.ts')
          test_text = test_path.read_text()
          marker = 'test("createGlobalScopeTransformer: uses transformed top-level heritage declarations"'
          if marker in test_text:
              raise SystemExit('regression already exists')
          test_text += r'''

          test("createGlobalScopeTransformer: uses transformed top-level heritage declarations", () => {
            const source = `declare class Base {
              stale(): string;
          }
          declare class ServiceWorkerGlobalScope extends Base {
          }
          `;

            const sourcePath = path.resolve(__dirname, "transformed-source.ts");
            const sources = new Map([[sourcePath, source]]);
            const program = createMemoryProgram(sources);
            const checker = program.getTypeChecker();
            const sourceFile = program.getSourceFile(sourcePath);
            assert(sourceFile !== undefined);

            const replaceBase: ts.TransformerFactory<ts.SourceFile> = (ctx) => {
              const visitor: ts.Visitor = (node) => {
                if (
                  ts.isClassDeclaration(node) &&
                  node.name?.text === "Base"
                ) {
                  const transformed = ctx.factory.createMethodDeclaration(
                    /* modifiers */ undefined,
                    /* asteriskToken */ undefined,
                    "transformed",
                    /* questionToken */ undefined,
                    /* typeParameters */ undefined,
                    [],
                    ctx.factory.createKeywordTypeNode(ts.SyntaxKind.NumberKeyword),
                    /* body */ undefined
                  );
                  return ctx.factory.updateClassDeclaration(
                    node,
                    node.modifiers,
                    node.name,
                    node.typeParameters,
                    node.heritageClauses,
                    ctx.factory.createNodeArray([transformed])
                  );
                }
                return ts.visitEachChild(node, visitor, ctx);
              };
              return (node) => ts.visitEachChild(node, visitor, ctx);
            };

            const result = ts.transform(sourceFile, [
              replaceBase,
              createGlobalScopeTransformer(checker),
            ]);
            assert.strictEqual(result.transformed.length, 1);

            const output = printer.printFile(result.transformed[0]);
            assert.match(output, /declare function transformed\(\): number;/);
            assert.doesNotMatch(output, /declare function stale\(\): string;/);
          });
          '''
          test_path.write_text(test_text)
          PY

      - name: Format changed source and test
        run: npx prettier --write types/src/transforms/globals.ts types/test/transforms/globals.spec.ts

      - name: Set up repository toolchain
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''

      - name: Run discriminating and focused tests
        run: |
          bazelisk test \
            //types:test/index.spec \
            //types:test/transforms/globals.spec \
            //types:test/transforms/overrides/index.spec \
            //types:test/transforms/overrides/replacement-receiver-generics.spec \
            --test_output=errors
          git diff --check

      - name: Publish clean repair commit
        run: |
          rm .github/workflows/unit-10-heritage-repair.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(types): resolve globals through transformed heritage"
          git push origin HEAD:unit-10/receiver-aware-types-heritage-repair
